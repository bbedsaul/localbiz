# Fly.io config — deploy from the monorepo root:
#   fly deploy --config packages/sitevitals-worker/fly.toml --dockerfile packages/sitevitals-worker/Dockerfile
app = "sitevitals-worker"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  LOG_LEVEL = "info"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false   # always-on: uptime checks must keep running
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/healthz"
