name: Lighthouse (web home)

on:
  pull_request:
    paths:
      - 'packages/web/**'
      - 'packages/sitevitals-engine/**'
      - 'packages/core/**'
      - 'lighthouserc.json'
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build core → engine → web
        env:
          # NEXT_PUBLIC_* are inlined at build; dummies are fine for a Lighthouse
          # pass of the static home page (the scan only fires on user submit).
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000
        run: |
          pnpm --filter @platform/core build
          pnpm --filter sitevitals-engine build
          pnpm --filter web build
      - name: Run Lighthouse CI (home page, mobile ≥95)
        run: npx --yes @lhci/cli@0.14.x autorun
